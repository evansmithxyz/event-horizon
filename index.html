<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Schwarzschild black hole, ray-traced in real time with three.js." />
    <title>Event Horizon</title>
  </head>
  <body>
    <div id="app"></div>

    <header class="overlay title">
      <h1>Event Horizon</h1>
      <p>A Schwarzschild black hole, ray-traced in real time</p>
    </header>

    <footer class="overlay hints">
      <span><kbd>Drag</kbd>orbit</span>
      <span><kbd>Scroll</kbd>zoom</span>
      <span><kbd>G</kbd>toggle gravity</span>
      <span><kbd>Space</kbd>auto-rotate</span>
      <span><kbd>H</kbd>hide UI</span>
    </footer>

    <div class="overlay hud" id="hud"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
